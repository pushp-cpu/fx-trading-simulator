services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: fxsim
      POSTGRES_USER: fxuser
      POSTGRES_PASSWORD: fxpassword
    ports:
      - "5434:5432"
    volumes:
      - fxsim_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fxuser -d fxsim"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://fxuser:fxpassword@db:5432/fxsim
      TICK_INTERVAL_SECONDS: "1"
      STARTING_CASH_INR: "1000000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws/prices
    ports:
      - "3000:3000"
    depends_on:
      - backend
volumes:
  fxsim_pgdata:
